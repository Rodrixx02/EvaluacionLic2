<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Log in UDB</title>
</head>
<body style="background-color:#84b3ce;">
    <div class="container-sm mt-5">
<form class="row g-3">
        <div class="col-md-6">
            <label for="inputEmail" class="form-label">Correo</label>
            <input type="text" class="form-control" id="inputEmail">
        </div>

        <div class="col-md-6">
            <label for="inputPassword" class="form-label">Contraseña</label>
            <input type="text" class="form-control" id="inputPassword">
        </div>

        <div class="col-md-6">
            <label for="inputTarjeta" class="form-label">Numero de tarjeta</label>
            <input type="text" class="form-control" id="inputTarjeta">
        </div>

        <div class="col-md-6">
            <label for="inputPhoneNumber" class="form-label">Numero Telefonico</label>
            <input type="text" class="form-control" id="inputPhoneNumber">
        </div>

        <div class="col-md-2">
            <label for="inputFecha" class="form-label">Fecha tarjeta</label>
            <input type="text" class="form-control" id="inputFecha">
        </div>

        <div class="col-12">
            <button type="submit" class="btn btn-outline-dark" id="btnConfirmar">Verificar</button>
        </div>

    </form>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
